# Blueprint Render : crée le site (Docker/PHP) + la base PostgreSQL
services:
  - type: web
    name: igs-securite
    runtime: docker
    plan: free            # passez à "starter" pour un site toujours actif
    healthCheckPath: /index.php
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: igs-securite-db
          property: connectionString
      - key: INSTALL_KEY
        generateValue: true

databases:
  - name: igs-securite-db
    plan: free
    databaseName: igs_securite
    user: igs_admin
